graphhopper:

  datareader.file: "your-map.osm.pbf"
  graph.location: graph-cache

  # WICHTIG: CustomGraphHopper verwenden!
  graph.custom_class: com.graphhopper.custom.CustomGraphHopper

  # WICHTIG: custom_present muss hier registriert werden!
  graph.encoded_values: custom_present

  profiles:
    # Standard Car-Profil
    - name: car
      custom_model_files: [car.json]

    # Dein Custom Profil - bevorzugt Straßen mit custom_present=true
    - name: car_custom
      custom_model_files: [car_prefer_custom_present.json]
    
    # Alternative: Inline Custom Model direkt in der Config
    - name: car_custom_inline
      custom_model:
        distance_influence: 70
        priority:
          - if: "custom_present == false"
            multiply_by: 0.5
        speed:
          - if: "true"
            limit_to: "car_average_speed"

  # CH für schnelleres Routing (optional)
  profiles_ch:
    - profile: car
    - profile: car_custom

  # Oder LM (Landmarks) für mehr Flexibilität
  profiles_lm: []
